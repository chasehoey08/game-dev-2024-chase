



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASD Game - Enhanced Levels</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: lightblue;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #menu, #game-area {
            text-align: center;
        }
        #menu {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 8px;
        }
        button:hover {
            background-color: #45a049;
        }
        #game-area {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: lightblue;
            overflow: hidden;
        }
        .character, .enemy, .goal, .obstacle {
            position: absolute;
            width: 50px;
            height: 50px;
        }
        .character {
            background: green;
            border-radius: 50%;
        }
        .enemy {
            background: red;
            border-radius: 50%;
        }
        .goal {
            background: gold;
            animation: pulse 1.5s infinite;
        }
        .obstacle {
            background: gray;
        }
        #info-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;
            z-index: 1000;
        }
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.2);
                opacity: 0.8;
            }
        }
    </style>
    <script>
        let player, enemies, goal, level, lives, score, enemyIntervals = [];

        function showMenu() {
            document.body.innerHTML = `
                <div id="menu">
                    <h1>Welcome to the WASD Game</h1>
                    <p>Select a level to play:</p>
                    <button onclick="startGame(1)">Start Level 1</button>
                    <button onclick="startGame(2)">Start Level 2</button>
                    <button onclick="startGame(3)">Start Level 3</button>
                </div>
            `;
        }

        function startGame(selectedLevel) {
            level = selectedLevel;
            lives = 3; // Default lives
            score = 0; // Initial score
            initGame();
        }

        function initGame() {
            document.body.innerHTML = `
                <div id="info-panel">
                    Level: ${level} | Score: ${score} | Lives: ${lives}
                </div>
                <div id="game-area"></div>
            `;
            const gameArea = document.getElementById('game-area');
            gameArea.innerHTML = '';

            // Clear existing enemy movement intervals
            enemyIntervals.forEach(clearInterval);
            enemyIntervals = [];

            // Create player
            player = document.createElement('div');
            player.id = 'player';
            player.className = 'character';
            player.style.left = '10px';
            player.style.top = '10px';
            gameArea.appendChild(player);

            // Create enemies and goal based on level
            enemies = [];
            const layouts = {
                enemies: [
                    // Level 1
                    [{ left: '300px', top: '200px', pattern: 'horizontal' }],
                    // Level 2
                    [{ left: '200px', top: '400px', pattern: 'vertical' }, { left: '400px', top: '100px', pattern: 'random' }],
                    // Level 3
                    [
                        { left: '100px', top: '100px', pattern: 'horizontal' },
                        { left: '500px', top: '500px', pattern: 'vertical' },
                        { left: '700px', top: '400px', pattern: 'random' }
                    ]
                ]
            };

            layouts.enemies[level - 1].forEach(pos => createMovingEnemy(pos));

            // Create goal
            goal = document.createElement('div');
            goal.className = 'goal';
            goal.style.left = '90vw';
            goal.style.top = '90vh';
            gameArea.appendChild(goal);
        }

        function createMovingEnemy({ left, top, pattern }) {
            const enemy = document.createElement('div');
            enemy.className = 'enemy';
            enemy.style.left = left;
            enemy.style.top = top;
            document.getElementById('game-area').appendChild(enemy);
            enemies.push(enemy);

            // Add movement patterns
            let direction = 1;
            let moveAmount = 2;
            let interval = setInterval(() => {
                let newLeft = parseInt(enemy.style.left, 10);
                let newTop = parseInt(enemy.style.top, 10);

                if (pattern === 'horizontal') {
                    newLeft += direction * moveAmount;
                    if (newLeft > window.innerWidth - 50 || newLeft < 0) direction *= -1;
                } else if (pattern === 'vertical') {
                    newTop += direction * moveAmount;
                    if (newTop > window.innerHeight - 50 || newTop < 0) direction *= -1;
                } else if (pattern === 'random') {
                    newLeft += Math.random() * moveAmount * 2 - moveAmount;
                    newTop += Math.random() * moveAmount * 2 - moveAmount;

                    // Ensure enemies stay within bounds
                    newLeft = Math.max(0, Math.min(window.innerWidth - 50, newLeft));
                    newTop = Math.max(0, Math.min(window.innerHeight - 50, newTop));
                }

                enemy.style.left = `${newLeft}px`;
                enemy.style.top = `${newTop}px`;
            }, 30);

            enemyIntervals.push(interval);
        }

        function updateInfoPanel() {
            const infoPanel = document.getElementById('info-panel');
            infoPanel.textContent = `Level: ${level} | Score: ${score} | Lives: ${lives}`;
        }

        function checkCollision() {
            const playerRect = player.getBoundingClientRect();

            // Check collision with enemies
            for (let enemy of enemies) {
                const enemyRect = enemy.getBoundingClientRect();
                if (isColliding(playerRect, enemyRect)) {
                    lives--;
                    updateInfoPanel();
                    if (lives <= 0) {
                        alert('Game over! Returning to menu.');
                        showMenu();
                    } else {
                        alert('Hit an enemy! Restarting level.');
                        initGame();
                    }
                    return;
                }
            }

            // Check collision with goal
            const goalRect = goal.getBoundingClientRect();
            if (isColliding(playerRect, goalRect)) {
                score += 100; // Increase score on completing level
                updateInfoPanel();
                if (level < 3) {
                    alert(`Level ${level} complete!`);
                    level++;
                    initGame();
                } else {
                    alert('Congratulations! You completed all levels!');
                    showMenu();
                }
            }
        }

        function isColliding(rect1, rect2) {
            return (
                rect1.right > rect2.left &&
                rect1.left < rect2.right &&
                rect1.bottom > rect2.top &&
                rect1.top < rect2.bottom
            );
        }

        document.addEventListener('keydown', (event) => {
            switch (event.key) {
                case 'w':
                    movePlayer(0, -10);
                    break;
                case 'a':
                    movePlayer(-10, 0);
                    break;
                case 's':
                    movePlayer(0, 10);
                    break;
                case 'd':
                    movePlayer(10, 0);
                    break;
            }
        });

        function movePlayer(dx, dy) {
            const playerRect = player.getBoundingClientRect();
            const gameRect = document.getElementById('game-area').getBoundingClientRect();

            let newX = player.offsetLeft + dx;
            let newY = player.offsetTop + dy;

            // Prevent going out of bounds
            if (newX < 0) newX = 0;
            if (newY < 0) newY = 0;
            if (newX + playerRect.width > gameRect.width) newX = gameRect.width - playerRect.width;
            if (newY + playerRect.height > gameRect.height) newY = gameRect.height - playerRect.height;

            player.style.left = newX + 'px';
            player.style.top = newY + 'px';

            checkCollision();
        }

        window.onload = showMenu;
    </script>
</head>
<body>
</body>
</html>
